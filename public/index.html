<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101311"><title>栈 · 股票与加密交易日志</title><link rel="stylesheet" href="/style.css?v=2"></head>
<body>
<section id="auth" class="auth-screen"><div class="auth-card"><div class="brand-mark">栈<span>.</span></div><p class="eyebrow">股票与加密资产工作台</p><h1>把每一次交易<br>都记清楚。</h1><p class="muted">炒股 / 炒币双模式，持仓追踪与交易复盘。</p><form id="authForm"><label>用户名<input name="username" minlength="3" autocomplete="username" required placeholder="至少 3 位"></label><label>密码<input name="password" type="password" minlength="8" autocomplete="current-password" required placeholder="至少 8 位"></label><button class="btn primary full" id="authSubmit">登录</button><div class="auth-bottom"><span id="authMsg" class="muted"></span><button id="toggleAuth" class="link-btn" type="button">创建账户</button></div></form><p class="tiny">开源自托管 · 每个账户的数据独立保存</p></div><div class="auth-art"><div class="art-orbit orbit-a"></div><div class="art-orbit orbit-b"></div><div class="art-core">₿</div><div class="art-caption">记录 · 复盘 · 进步</div></div></section>
<div id="app" class="app-shell hidden">
<aside class="sidebar"><a class="brand" href="#"><span class="brand-mark small">栈<span>.</span></span><span>交易日志</span></a><div class="workspace-label">工作空间</div><nav id="nav"><button class="nav-item active" data-page="overview"><span class="nav-icon">◫</span>总览</button><button class="nav-item" data-page="holdings"><span class="nav-icon">◈</span>持仓</button><button class="nav-item" data-page="journal"><span class="nav-icon">▤</span>交易记录</button><button class="nav-item" data-page="review"><span class="nav-icon">⌁</span>复盘</button></nav><div class="sidebar-bottom"><button class="nav-item" data-page="import"><span class="nav-icon">↥</span>导入数据</button><div class="user-box"><div class="avatar" id="avatar">C</div><div class="user-meta"><strong id="userName">用户</strong><small id="accountUnit">炒币 · USDT 账户</small></div><button class="logout" id="logout" title="退出登录">↗</button></div></div></aside>
<main class="main"><header class="topbar"><div><div class="eyebrow" id="dateLabel">个人交易工作台</div><h1 id="pageTitle">总览</h1></div><div class="top-actions"><span class="sync-indicator"><i></i> 账户同步</span><button class="btn primary" id="quickAdd">＋ 记一笔</button></div></header>
<div class="mode-bar"><div><strong>选择记录模式</strong><p id="modeDescription">现货与合约 · USDT 计价</p></div><div id="modeSwitch" class="mode-switch" role="group" aria-label="记录模式"><button data-mode="crypto" class="active" aria-pressed="true">₿ 炒币</button><button data-mode="stocks" aria-pressed="false">↗ 炒股 · A 股</button></div></div><div class="content" id="content"></div><footer>栈 · 交易日志 <span>记录不构成投资建议</span></footer></main>
</div><div id="toast" class="toast"></div><script src="/app.js?v=2"></script></body></html>
