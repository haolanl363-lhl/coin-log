services:
  - type: web
    name: coin-log
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: COINLOG_HOST
        value: 0.0.0.0
      - key: COINLOG_DATA_DIR
        value: /opt/render/project/src/data
      - key: COINLOG_SECURE_COOKIE
        value: "true"
    disk:
      name: coin-log-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
