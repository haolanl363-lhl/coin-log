services:
  - type: web
    name: coin-log
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: COINLOG_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: COINLOG_SECURE_COOKIE
        value: "true"
